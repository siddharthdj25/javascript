<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div>
        <button id="addbtn">add to localstorage</button>
        <button id="getbtn">get Data from localstorage</button>
        <button id="removebtn">remove from localstorage</button>
    </div>

    <script>
        const studentbiodata = {
            firstname: "siddharth",
            lastname: "jadhav",
            age: 20,
            gender: "male",
            grade: "A",
            courses: ["math", "science", "english"],
            address: {
                street: "123.Main.st",
                city: "cityville",
                state: "state",
                zipcode: "12345",
            },
        };

        const addtodoList = () => {
            localStorage.setItem("objectData", JSON.stringify(studentbiodata));
        };

        const gettodoList = () => {
            const data = JSON.parse(localStorage.getItem("objectData"));
            console.log(data);
        };

        const removetodolist = () => {
            localStorage.removeItem("objectData");
        };

        document.getElementById("addbtn").addEventListener("click", () => {
            addtodoList();
        });

        document.getElementById("getbtn").addEventListener("click", () => {
            gettodoList();
        });

        document.getElementById("removebtn").addEventListener("click", () => {
            removetodolist();
        });
    </script>

</body>
</html>
