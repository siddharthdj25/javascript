<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <section>
        <p id="countDown">0</p>

        <div class="buttons">
            <button class="start_btn">start</button>
            <button class="reset_btn">Reset</button>
            <button class="stop_btn">stop</button>
            <button class="time_btn">settime</button>
            <button class="cleartime">clearTime</button>
        </div>

        <div class="resetValue"></div>
    </section>

    <script>
       const countDownElement = document.getElementById("countDown");
const resetValueElement = document.querySelector(".resetValue");

let start = 2;
let intervalId;

const startTimer = () => {

    const updateTime = () => {
        countDownElement.innerText = start++;
    };

    intervalId = setInterval(updateTime, 1000);
};

const stopTimer = () => {
    clearInterval(intervalId);
};

const resetTimer = () => {
    start = 2;
    countDownElement.innerText = start;
    clearInterval(intervalId);
};

const showstopvalue = () => {
    const newpara = document.createElement("p");
    newpara.innerText = `The stop value is ${start}`;
    resetValueElement.appendChild(newpara);
};

document.querySelector(".start_btn")
    .addEventListener("click", startTimer);

document.querySelector(".stop_btn")
    .addEventListener("click", stopTimer);

document.querySelector(".reset_btn")
    .addEventListener("click", resetTimer);

document.querySelector(".time_btn")
    .addEventListener("click", showstopvalue);

    </script>

</body>
</html>
