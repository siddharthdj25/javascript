<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>

<body>

    <h1>Todo List</h1>
    <br>

    <form>
        <div>
            <input type="text" id="inputValue">
            <button class="btn">Add Todo</button>
        </div>

        <section class="todo-list-elem"></section>
    </form>

    <script>
        const maintodoelem = document.querySelector(".todo-list-elem");
        const inputvalue = document.getElementById("inputValue");

        const addtodolist = (e) => {
            e.preventDefault();

            const getTodoListfromlocal = () => {
                return JSON.parse(localStorage.getItem("youtubeTodoList"));
            };

            let localTodoList = getTodoListfromlocal() || [];

            let todoListvalue = inputvalue.value.trim();

            localTodoList.push(todoListvalue);

            localTodoList = [...new Set(localTodoList)];

            console.log(localTodoList);

            localStorage.setItem(
                "youtubeTodoList",
                JSON.stringify(localTodoList)
            );

            const divelem = document.createElement("div");

            divelem.classList.add("main_todo_div");

            divelem.innerHTML = `
                <li>${todoListvalue}</li>
                <button class="deletebtn">DELETE</button>
            `;

            maintodoelem.append(divelem);
        };

        document.querySelector(".btn").addEventListener("click", (e) => {
            addtodolist(e);
        });
    </script>

</body>
</html>
